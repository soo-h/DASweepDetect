[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dasdc"
version = "1.0.1"
description = "Domain adversarial detection and classification of selective sweeps"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "matplotlib>=3.3.3,<3.6; python_version < '3.10'",
    "matplotlib>=3.7; python_version >= '3.10'",
    "numpy>=1.18.5,<1.24; python_version < '3.10'",
    "numpy>=1.23.5; python_version >= '3.10'",
    "scikit-allel>=1.3.2,<1.4; python_version < '3.10'",
    "scikit-allel>=1.3.7; python_version >= '3.10'",
    "scikit-learn>=0.24.2,<1.1; python_version < '3.10'",
    "scikit-learn>=1.3; python_version >= '3.10'",
    "scipy>=1.5.4,<1.10; python_version < '3.10'",
    "scipy>=1.10; python_version >= '3.10'",
    "setproctitle>=1.3.2",
    "protobuf==3.20.0; python_version < '3.10'",
    "keras==2.7.0; python_version < '3.10'",
    "Keras-Preprocessing==1.1.2; python_version < '3.10'",
    "tensorboard==2.6.0; python_version < '3.10'",
    "tensorboard-data-server==0.6.1; python_version < '3.10'",
    "tensorflow==2.7.0; python_version < '3.10'",
    "tensorflow-estimator==2.7.0; python_version < '3.10'",
    "tensorflow-io-gcs-filesystem==0.32.0; python_version < '3.10'",
]

[project.optional-dependencies]
pytorch = ["torch>=2.2"]

[project.scripts]
dasdc = "dasdc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dasdc*", "DASD*"]
exclude = ["tests*"]
